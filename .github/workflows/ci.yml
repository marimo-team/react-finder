name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      VP_GIT_HOOKS: "0"
    steps:
      - uses: actions/checkout@v5

      # Installs Vite+, Node and pnpm (from package.json "packageManager") with dependency caching.
      - uses: voidzero-dev/setup-vp@0cffb0a1ac50daa1541b57d1eb7c843f479522e1 # v1.18.0
        with:
          node-version: "22"
          cache: true

      - run: vp install --frozen-lockfile

      - name: Format, lint, type-check
        run: vp check

      - name: Typecheck (tsc, library + demo)
        run: vp run typecheck

      - name: Test
        run: vp test run

      - name: Build library
        run: vp pack

      - name: Validate package exports
        run: vp run check:package

      - name: Build demo
        run: vp build
